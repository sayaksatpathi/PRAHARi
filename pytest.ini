[pytest]
# Prahari's own suite lives in tests/. Scope collection there so pytest never
# walks vendored/auto-cloned model trees (e.g. models/awiros_anpr/PaddleOCR/,
# gitignored) whose own test files break collection for the whole session.
testpaths = tests
norecursedirs = models data var .venv .git build dist
# The Playwright e2e suite is a separate gated stage: it needs `playwright
# install` + a Chromium binary, and pytest-playwright's runtest hook conflicts
# with pytest-asyncio's loop management for the plain-asyncio tests when both
# are collected in one session. Run it explicitly with:
#   pytest tests/e2e_browser -o addopts=""
addopts = --ignore=tests/e2e_browser
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
